<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, user-scalable=no">
<title>BadarasOS · Prévia estilo Netflix</title>
<style>
/* Prévia de design: não é usada pela TV. Tela de 1920x1080, escalada para caber na janela. */
@font-face{font-family:'Hanken Grotesk';src:url('hanken.ttf');font-weight:100 900}

/* ===== Tokens =====
   Grid de 8 pontos: todo espaço, tamanho e raio é múltiplo de 8 (4 só para ajustes finos).
   Fontes em múltiplos de 4. */
:root{
  --accent:#e50914;           /* destaque (C troca na prévia) */
  --accent-ink:#fff;
  --bg:#0b0b0f;
  --surface:#18181f;
  --surface-2:#24242d;
  --text:#fff;
  --text-2:rgba(255,255,255,0.72);
  --text-3:rgba(255,255,255,0.5);
  --focus:#fff;
  --match:#46d369;
  /* espaço */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px; --s8:48px; --s10:64px; --s12:96px;
  /* tipo */
  --t-xs:12px; --t-s:16px; --t-m:20px; --t-l:24px; --t-xl:32px; --t-2xl:40px; --t-3xl:48px; --t-hero:80px;
  /* raio */
  --r-s:4px; --r-m:8px; --r-l:16px; --r-pill:999px;
  /* layout */
  --rail:104px;               /* menu fechado */
  --x:168px;                  /* coluna de conteúdo: menu + 64 */
  --safe-x:120px;             /* margem segura nas telas sem menu */
  --top:48px;                 /* margem do topo */
  --ring:0 0 0 4px var(--focus);
  --ease:cubic-bezier(.2,.8,.2,1);
}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
*{box-sizing:border-box}
#stage{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;
  font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.f{outline:none}

/* ===== Destaque (billboard) ===== */
#bb{position:absolute;right:0;top:0;width:1504px;height:848px;transition:background .45s}
#bb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
#bb img.show{opacity:1}
/* Arte clara (colagem com fundo branco): mostra o pôster emoldurado no lugar. */
#bb img.framed,.ov .art.framed{inset:auto;right:var(--safe-x);top:136px;width:320px;height:480px;border-radius:var(--r-m);box-shadow:0 32px 64px rgba(0,0,0,0.6)}
#bbShade,.ov .shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0%,rgba(11,11,15,0.92) 24%,rgba(11,11,15,0.55) 48%,rgba(11,11,15,0) 72%),
             linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,0.6) 32%,rgba(11,11,15,0) 64%),
             linear-gradient(180deg,rgba(11,11,15,0.72) 0%,rgba(11,11,15,0) 24%)}
#bb.framed #bbShade{background:linear-gradient(0deg,var(--bg) 0%,rgba(11,11,15,0) 40%)}

#info{position:absolute;left:var(--x);top:120px;width:832px;display:flex;flex-direction:column;gap:var(--s4)}
body.hasTop #info{top:144px}
.kick{display:flex;align-items:center;gap:var(--s2);height:32px;font-size:var(--t-s);font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text-2)}
.kick b{display:inline-flex;width:32px;height:32px;border-radius:var(--r-m);background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:var(--t-m);letter-spacing:0}
#logoBox{height:192px;display:flex;align-items:flex-end}
body.hasTop #logoBox{height:160px}
#logo{max-width:600px;max-height:100%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.6))}
.htitle,#title{margin:0;font-size:var(--t-hero);line-height:1;font-weight:800;letter-spacing:-2px;display:none}
/* Título longo (vídeo do YouTube): menor e em até 2 linhas */
#title.long{font-size:var(--t-3xl);line-height:56px;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-1px;max-width:832px}
.meta{display:flex;align-items:center;gap:var(--s3);height:32px;font-size:var(--t-m);font-weight:600;color:var(--text-2);white-space:nowrap}
.meta .m{color:var(--match);font-weight:800}
.meta .tag{height:24px;padding:0 var(--s2);border:2px solid rgba(255,255,255,0.5);border-radius:var(--r-s);display:inline-flex;align-items:center;font-size:var(--t-xs);font-weight:800;color:var(--text)}
.desc{margin:0;font-size:var(--t-m);line-height:32px;color:var(--text);opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:760px;text-shadow:0 2px 16px rgba(0,0,0,0.6)}
#prog{display:none;align-items:center;gap:var(--s4);height:24px;font-size:var(--t-s);color:var(--text-2)}
#prog .bar{width:304px;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;overflow:hidden}
#prog .bar i{display:block;height:100%;background:var(--accent)}
#btns,.brow{display:flex;gap:var(--s4);margin-top:var(--s2)}
.btn{height:64px;padding:0 var(--s6);border-radius:var(--r-m);display:flex;align-items:center;gap:var(--s3);font-size:var(--t-l);font-weight:700;white-space:nowrap;
  background:rgba(109,109,110,0.55);color:#fff;transition:transform .15s var(--ease),background .15s,color .15s}
.btn svg{width:32px;height:32px}
.btn.icon{width:64px;padding:0;justify-content:center;border-radius:50%}
.btn.icon svg{width:24px;height:24px}
.btn.primary{background:#fff;color:#000}
.btn.on{background:var(--focus);color:#000;transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,0.24)}
.btn.primary.on{background:var(--accent);color:var(--accent-ink);box-shadow:var(--ring)}
#btns.solo .btn:not(.primary){display:none}

/* ===== Fileiras =====
   Coluna dos cartões alinhada com o texto do destaque (x = 168). As fileiras têm altura do conteúdo,
   então o título de uma nunca encosta nos cartões da outra. */
#rowsVp{position:absolute;left:calc(var(--x) - var(--s2));right:0;top:648px;bottom:0;overflow:hidden}
#rows{transition:transform .35s var(--ease)}
.lane{padding:0 0 var(--s4) var(--s2);transition:opacity .3s}
.lane.past,.lane.below{opacity:0}
.lane.peek .track{opacity:0} /* fileira que não cabe inteira: só o título aparece, como aviso de que tem mais */
.lane h2,.sec h2,.ov h2{margin:0;height:32px;font-size:var(--t-l);font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:var(--s3)}
.lane h2 small,.sec h2 small{font-size:var(--t-s);font-weight:600;color:var(--text-3)}
.lane.t-top .track{gap:var(--s5)}
.track{display:flex;gap:var(--s4);transition:transform .3s var(--ease);padding:var(--s5) 0 var(--s4)}
.loading{font-size:var(--t-m);color:var(--text-3);padding:var(--s6) var(--s6)}

/* Cartões */
.c{flex:0 0 auto;position:relative;border-radius:var(--r-m);overflow:hidden;background:var(--surface);
  transition:transform .2s var(--ease),box-shadow .2s}
.c img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c img.bg.pos{object-position:center 20%}
.c.on{transform:scale(1.08);z-index:2;box-shadow:var(--ring),0 16px 40px rgba(0,0,0,0.7)}
.track>.c,.track>.top{transform-origin:left top}
.top.ten .n{letter-spacing:-8px}
.c.land{width:352px;height:200px}
.c.cap{width:352px;height:168px}
.c.port{width:176px;height:264px}
.c.game img.bg{height:104%}
.shade2{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.8) 0%,rgba(0,0,0,0) 56%)}
.c.land img.lg{position:absolute;left:var(--s4);bottom:var(--s4);max-width:64%;max-height:56px;object-fit:contain;object-position:left bottom}
.c.cont img.lg,.c.cont .nm{bottom:var(--s5)}
.c .nm{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s4);font-size:var(--t-m);font-weight:800;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .pb{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s2);height:4px;border-radius:2px;background:rgba(255,255,255,0.3)}
.c .pb i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.c .sub{position:absolute;left:var(--s4);bottom:var(--s3);font-size:var(--t-s);line-height:16px;font-weight:600;color:var(--text-2)}
.c .cap2{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s4);font-size:var(--t-s);font-weight:700;line-height:24px}
.badge{position:absolute;left:var(--s2);top:var(--s2);height:24px;padding:0 var(--s2);border-radius:var(--r-s);font-size:var(--t-xs);font-weight:800;letter-spacing:.5px;display:flex;align-items:center;background:rgba(0,0,0,0.72)}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.badge.hydra{background:#7c6cf0}
.badge.yt{background:#ff0033}
.c.app{width:272px;height:152px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);font-size:var(--t-m);font-weight:700;
  background:linear-gradient(160deg,color-mix(in srgb,var(--b) 40%,var(--surface)) 0%,var(--surface) 80%)}
.c.app img.ai{width:64px;height:64px;border-radius:var(--r-l);object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.4))}
.c.app.dock{width:auto;height:200px;gap:var(--s4);font-size:var(--t-l)}
.c.app.dock img.ai{width:96px;height:96px}
.c.app.g{width:auto}
.c.act{width:272px;height:152px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);font-size:var(--t-m);font-weight:700}
.c.act svg{width:48px;height:48px;color:var(--accent)}
.c.port.g{width:auto;height:auto;aspect-ratio:2/3}
.c.app.on,.c.port.g.on{transform:scale(1.05)}

/* Top 10: número grande vazado à esquerda do pôster.
   A Hanken é variável e os traços de cada algarismo se sobrepõem; com contorno, as sobreposições
   viram riscos dentro do número. Por isso o contorno fica numa camada de trás (8 px, metade aparece)
   e uma cópia só com preenchimento vai por cima e cobre os riscos internos. */
.top{flex:0 0 auto;height:312px;gap:var(--s2);display:flex;align-items:flex-end;transition:transform .2s var(--ease)}
.top .n{flex:0 0 auto;font-size:224px;line-height:168px;font-weight:900;letter-spacing:0;
  color:var(--bg);-webkit-text-stroke:8px #6e6e7a;position:relative;z-index:0}
.top .n::after{content:attr(data-n);position:absolute;inset:0;color:var(--bg);-webkit-text-stroke:0}
.top .c{position:relative;z-index:1}
.top .c.port{width:208px;height:312px} /* Top 10 tem pôster maior que as outras fileiras, como no Netflix */
.top.on{transform:scale(1.05);z-index:2}
.top.on .c{box-shadow:var(--ring),0 16px 40px rgba(0,0,0,0.7)}
.top.on .n{-webkit-text-stroke-color:#fff}
.top.ten .n::after{letter-spacing:-8px}

/* ===== Menu lateral (abre ao receber foco) ===== */
#railShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,0.96) 0%,rgba(0,0,0,0.86) 24%,rgba(0,0,0,0) 48%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);z-index:10;display:flex;flex-direction:column;justify-content:center;gap:var(--s2);padding:0 0 0 var(--s6);
  background:linear-gradient(90deg,rgba(0,0,0,0.72),rgba(0,0,0,0));transition:width .3s var(--ease)}
#rail .who{position:absolute;top:var(--top);left:var(--s5);display:flex;align-items:center;gap:var(--s4)}
.avatar{width:56px;height:56px;border-radius:var(--r-m);background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:var(--t-l);color:var(--accent-ink)}
.ni{height:56px;display:flex;align-items:center;gap:var(--s5);color:var(--text-3);font-size:var(--t-l);font-weight:700;white-space:nowrap;position:relative}
.ni svg{flex:0 0 32px;width:32px;height:32px}
.ni span,.who span{opacity:0;transform:translateX(-8px);transition:opacity .2s,transform .2s}
.ni.sel{color:var(--text)}
.ni.sel::before{content:"";position:absolute;left:calc(-1 * var(--s6));top:var(--s4);bottom:var(--s4);width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
body.railOpen #rail{width:424px}
body.railOpen #railShade{opacity:1}
body.railOpen .ni span,body.railOpen .who span{opacity:1;transform:none}
.ni.on{color:#fff;transform:scale(1.04);transform-origin:left center}
.ni.on span{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:4px;text-underline-offset:8px}
.who span{font-size:var(--t-m);font-weight:700}

/* ===== Relógio, legenda e avisos ===== */
#clock{position:absolute;right:var(--s8);top:var(--top);text-align:right;z-index:5;text-shadow:0 2px 16px rgba(0,0,0,0.7)}
#clock b{display:block;font-size:var(--t-xl);line-height:40px;font-weight:700}
#clock span{display:block;font-size:var(--t-s);line-height:24px;color:var(--text-2)}
#hint{position:absolute;left:var(--s6);bottom:var(--s6);font-size:var(--t-xs);line-height:24px;color:var(--text-3);z-index:11;opacity:0;transition:opacity .3s}
body.railOpen #hint{opacity:1}
#hint kbd{font-family:inherit;border:1px solid rgba(255,255,255,0.3);border-radius:var(--r-s);padding:0 var(--s1);margin:0 2px}
#toast{position:absolute;left:50%;bottom:var(--s8);transform:translate(-50%,16px);height:56px;padding:0 var(--s6);border-radius:var(--r-m);background:#fff;color:#000;font-size:var(--t-m);font-weight:700;display:flex;align-items:center;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Barra do topo (abas, filtros, status) ===== */
#topbar{position:absolute;left:var(--x);top:var(--top);height:48px;display:flex;align-items:center;gap:var(--s2);z-index:6}
.tb{height:48px;padding:0 var(--s5);border-radius:var(--r-pill);display:flex;align-items:center;gap:var(--s2);font-size:var(--t-m);font-weight:700;color:var(--text-2);white-space:nowrap;flex:0 0 auto;
  transition:transform .15s var(--ease),background .15s,color .15s}
.tb svg{width:24px;height:24px}
.tb b{color:#fff;font-weight:800}
.tb.title{font-size:var(--t-xl);font-weight:800;color:#fff;padding:0 var(--s4) 0 0;letter-spacing:-.5px}
.tb.sel{color:#fff;background:rgba(255,255,255,0.16)}
.tb.outline{box-shadow:inset 0 0 0 2px rgba(255,255,255,0.32);color:#fff}
.tb.chip{font-size:var(--t-s);background:rgba(255,255,255,0.08);color:var(--text);height:40px;padding:0 var(--s4)}
.tb.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--match);box-shadow:0 0 0 4px rgba(70,211,105,0.2)}
.tb.on{background:#fff;color:#000;box-shadow:none;transform:scale(1.06)}
.tb.on b{color:#000}
.tb.sm{height:40px;padding:0 var(--s4);font-size:var(--t-s)}
#menu{position:absolute;z-index:20;top:112px;width:384px;padding:var(--s2);border-radius:var(--r-l);background:#1c1c24;box-shadow:0 32px 80px rgba(0,0,0,0.75);display:none}
.mi{height:48px;padding:0 var(--s4);border-radius:var(--r-m);display:flex;align-items:center;justify-content:space-between;font-size:var(--t-m);font-weight:600;color:var(--text-2)}
.mi.sel{color:#fff;font-weight:800}
.mi.sel::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mi.on{background:#fff;color:#000}

/* ===== Telas com layout próprio =====
   O conteúdo começa 16 px antes da coluna (x = 152) e cada bloco tem 16 px de respiro,
   para o anel de foco não ser cortado e tudo alinhar em x = 168. */
#view{position:absolute;left:calc(var(--x) - var(--s4));right:var(--s6);top:var(--top);bottom:0;display:none}
body.isView #browse{display:none}
body.isView #view{display:block}
.vhead{display:flex;align-items:center;gap:var(--s2);height:48px;margin:0 var(--s4) var(--s5)}
.vs,.hs{overflow:hidden;scroll-behavior:smooth}
.hrow{display:flex;gap:var(--s4);padding:var(--s4)}
.grid{display:grid;gap:var(--s4);padding:var(--s4)}
.sec{margin-bottom:var(--s4)}
.sec h2{margin:0 var(--s4)}
.empty{font-size:var(--t-m);line-height:32px;color:var(--text-3);padding:var(--s5) 0}

/* Buscar */
.search{display:flex;gap:var(--s8);height:100%}
.kb{flex:0 0 576px}
.query{height:72px;margin:0 var(--s4) var(--s5);border-bottom:4px solid rgba(255,255,255,0.3);display:flex;align-items:center;gap:var(--s3);font-size:var(--t-xl);font-weight:700}
.query svg{width:32px;height:32px;color:var(--text-3)}
.query .ph{color:var(--text-3);font-weight:600}
.query i{width:4px;height:40px;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s2);padding:0 var(--s4)}
.key{height:64px;border-radius:var(--r-m);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:var(--t-l);font-weight:700;text-transform:uppercase;transition:transform .12s}
.key.wide{grid-column:span 2;font-size:var(--t-m);text-transform:none;gap:var(--s2)}
.key svg{width:24px;height:24px}
.key.on{background:#fff;color:#000;transform:scale(1.06)}
.results{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.results .grid{grid-template-columns:repeat(5,1fr)}

/* TV e Entradas */
.feat{width:640px;height:296px;border-radius:var(--r-l);position:relative;overflow:hidden;padding:var(--s6);display:flex;flex-direction:column;justify-content:flex-end;gap:var(--s2);
  background:var(--surface);transition:transform .2s var(--ease),box-shadow .2s}
.feat b{font-size:var(--t-xl);line-height:40px;font-weight:800;letter-spacing:-.5px}
.feat span{font-size:var(--t-m);color:var(--text-2)}
.feat .live{position:absolute;left:var(--s6);top:var(--s6);height:32px;padding:0 var(--s3);border-radius:var(--r-s);background:var(--accent);font-size:var(--t-xs);font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:var(--s2);color:#fff}
.feat .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
.feat svg.big{position:absolute;right:var(--s6);top:var(--s6);width:120px;height:120px;opacity:.18}
.feat.on,.inp.on{transform:scale(1.04);box-shadow:var(--ring),0 16px 40px rgba(0,0,0,0.7);z-index:2}
.inp{width:360px;height:248px;border-radius:var(--r-l);background:var(--surface);padding:var(--s5);display:flex;flex-direction:column;justify-content:space-between;position:relative;
  transition:transform .2s var(--ease),box-shadow .2s;box-shadow:inset 0 0 0 2px transparent}
.inp.sm{width:296px;height:200px}
.inp.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.inp.cur.on{box-shadow:var(--ring),0 16px 40px rgba(0,0,0,0.7)}
.inp svg{width:48px;height:48px;color:var(--text-2)}
.inp b{font-size:var(--t-xl);line-height:40px;font-weight:800;display:block}
.inp span{font-size:var(--t-s);line-height:24px;color:var(--text-2)}
.inp .st{position:absolute;right:var(--s5);top:var(--s5);height:24px;display:flex;align-items:center;font-size:var(--t-xs);font-weight:800;letter-spacing:.8px;padding:0 var(--s2);border-radius:var(--r-s);background:rgba(255,255,255,0.1)}
.inp.cur .st{background:var(--accent)}
.pcbox{margin:var(--s4);max-width:1104px;padding:var(--s6);border-radius:var(--r-l);background:var(--surface);display:flex;align-items:center;gap:var(--s5)}
.pcbox .txt{flex:1 1 auto}
.pcbox .txt b{font-size:var(--t-l);line-height:32px;display:block;margin-bottom:var(--s1)}
.pcbox .txt span{font-size:var(--t-s);line-height:24px;color:var(--text-2)}

/* Configurações */
.cfg{display:flex;gap:var(--s6);height:calc(100% - 96px)}
.slist{flex:0 0 384px;display:flex;flex-direction:column;gap:var(--s1);padding:var(--s4)}

<script>

// Lê a imagem em 32x18 e devolve brilho médio, brilho da borda e cor média (sem os brancos).

var TONES={};
function sample(url){
  if(TONES[url])return TONES[url];
  return TONES[url]=new Promise(function(res){
    var im=new Image();im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var c=document.createElement('canvas');c.width=32;c.height=18;var g=c.getContext('2d');g.drawImage(im,0,0,32,18);

        }

var TRIM={};
function trim(img){
  var u=img.currentSrc||img.src;if(!u||img.dataset.trim===u)return;img.dataset.trim=u;
  (TRIM[u]=TRIM[u]||new Promise(function(res){
    var im=new Image();im.crossOrigin='anonymous';
    im.onload=function(){
      try{
        var w=Math.min(im.naturalWidth,480),h=Math.round(im.naturalHeight*w/im.naturalWidth),k=im.naturalWidth/w;
        var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.drawImage(im,0,0,w,h);
        var d=g.getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1;
        for(var y=0;y<h;y++)for(var x=0;x<w;x++)if(d[(y*w+x)*4+3]>24){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
        if(x1<0)return res('');
        res('inset('+Math.floor(y0*k)+'px '+Math.floor((w-1-x1)*k)+'px '+Math.floor((h-1-y1)*k)+'px '+Math.floor(x0*k)+'px)');
      }catch(e){res('');}
    };
    im.onerror=function(){res('');};
    im.src='/img?u='+encodeURIComponent(u);
  })).then(function(box){if((img.currentSrc||img.src)===u)img.style.objectViewBox=box;});
}

// ---------- Foco ----------
function render(){
  document.querySelectorAll('.on').forEach(function(e){e.classList.remove('on');});
  var ov=OVS[OVS.length-1];
  document.body.classList.toggle('railOpen',!ov&&focus.zone==='rail');
  if(ov){if(ov.f){ov.f.classList.add('on');show(ov.f);}return;}
  menuEl.style.display=focus.zone==='menu'?'block':'none';
  if(focus.zone==='rail')navEls[focus.n].classList.add('on');
  if(PAGES[page].view){if(focus.zone==='view'&&vf){vf.classList.add('on');show(vf);}return;}
  if(focus.zone==='top')topFocusables()[focus.t].classList.add('on');
  if(focus.zone==='menu')menuEl.children[focus.m].classList.add('on');
  if(focus.zone==='btns')document.querySelectorAll('#btns .btn')[focus.b].classList.add('on');
  var laneEls=rowsEl.querySelectorAll('.lane');
  if(laneEls[focus.r])rowsEl.style.transform='translateY('+(-laneEls[focus.r].offsetTop)+'px)';
  for(var r=0;r<laneEls.length;r++){
    laneEls[r].classList.toggle('past',r<focus.r);
    // Abaixo da fileira com foco, só aparece fileira que cabe inteira; da seguinte, só o título.
    var top=laneEls[r].offsetTop-(laneEls[focus.r]?laneEls[focus.r].offsetTop:0),vh=$('rowsVp').clientHeight;
    var fits=top+laneEls[r].offsetHeight-16<=vh,peek=!fits&&top+48<=vh;
    laneEls[r].classList.toggle('peek',r>focus.r&&peek);
    laneEls[r].classList.toggle('below',r>focus.r&&!fits&&!peek);
    var tr=laneEls[r].querySelector('.track'),c=r===focus.r?focus.c:(+tr.dataset.c||0);
    tr.dataset.c=c;
    var kids=tr.children;
    tr.style.transform='translateX('+(-(kids[c]?kids[c].offsetLeft-kids[0].offsetLeft:0))+'px)'; // offsetLeft já inclui a margem da fileira
    if(r===focus.r&&focus.zone==='rows'&&kids[c])kids[c].classList.add('on');
  }
}
// Rola as áreas .vs (vertical) e .hs (horizontal) até o item com foco aparecer.
function show(el){
  var p=el.parentElement;
  while(p&&p!==document.body){
    if(p.classList.contains('vs')||p.classList.contains('hs')){
      var pr=p.getBoundingClientRect(),er=el.getBoundingClientRect(),m=40*SCALE;
      if(p.classList.contains('vs')){
        if(er.top<pr.top+m)p.scrollTop-=(pr.top+m-er.top)/SCALE;
        else if(er.bottom>pr.bottom-m)p.scrollTop+=(er.bottom-pr.bottom+m)/SCALE;
      } else {
        if(er.left<pr.left+m)p.scrollLeft-=(pr.left+m-er.left)/SCALE;
        else if(er.right>pr.right-m)p.scrollLeft+=(er.right-pr.right+m)/SCALE;
      }
    }
    p=p.parentElement;
  }
}
// Navegação espacial nas telas com layout próprio: vai para o item mais perto na direção da seta.
function spatial(root,from,dx,dy){
  var els=[].slice.call(root.querySelectorAll('.f')),fr=from.getBoundingClientRect();
  var fx=fr.left+fr.width/2,fy=fr.top+fr.height/2,cands=[];
  els.forEach(function(e){
    if(e===from||e.offsetParent===null)return;
    var r=e.getBoundingClientRect(),ex=r.left+r.width/2,ey=r.top+r.height/2;
    var main=dx?(ex-fx)*dx:(ey-fy)*dy,cross=dx?Math.abs(ey-fy):Math.abs(ex-fx);
    if(main<=8)return;
    var band=dx?cross<(fr.height+r.height)/2:true;
    cands.push({e:e,main:main,cross:cross,band:band});
  });
  if(!cands.length)return null;
  if(dx){
    var inBand=cands.filter(function(c){return c.band;});
    var pool=inBand.length?inBand:cands;
    pool.sort(function(a,b){return (a.main+a.cross*2)-(b.main+b.cross*2);});
    return pool[0].e;
  }
  var min=Math.min.apply(null,cands.map(function(c){return c.main;}));
  return cands.filter(function(c){return c.main<=min+60;}).sort(function(a,b){return a.cross-b.cross;})[0].e;
}
function nBtns(){return $('btns').classList.contains('solo')?1:3;}
function move(dx,dy){
  var ov=OVS[OVS.length-1],z=focus.zone;
  // O item com foco pode ter sido trocado (resultado de busca, filtro): volta para o primeiro.
  if(ov&&ov.f&&!ov.f.isConnected){ov.f=ov.el.querySelector('.f');return render();}
  if(!ov&&z==='view'&&vf&&!vf.isConnected){vf=viewEl.querySelector('.f');return render();}
  if(ov){var n=spatial(ov.el,ov.f,dx,dy);if(n){ov.f=n;if(ov.onFocus)ov.onFocus(n);render();}return;}
  if(z==='menu'){if(dy)focus.m=Math.max(0,Math.min(menuItems.length-1,focus.m+dy));return render();}
  if(z==='rail'){
    if(dy)focus.n=Math.max(0,Math.min(navEls.length-1,focus.n+dy));
    else if(dx>0)focus.zone=PAGES[page].view?'view':lanes.length?'rows':'top';
    return render();
  }
  if(z==='view'){
    var nx=vf&&spatial(viewEl,vf,dx,dy);
    if(nx){vf=nx;if(viewEl.onFocus)viewEl.onFocus(nx);}
    else if(dx<0)focus.zone='rail';
    return render();
  }
  if(z==='top'){
    var nt=topFocusables().length;
    if(dx){var t2=focus.t+dx;if(t2<0)focus.zone='rail';else focus.t=Math.min(nt-1,t2);}
    else if(dy>0){focus.zone='btns';focus.b=0;}
    return render();
  }
  if(z==='btns'){
    if(dx){var nb=focus.b+dx;if(nb<0)focus.zone='rail';else focus.b=Math.min(nBtns()-1,nb);}
    else if(dy>0)focus.zone='rows';
    else if(dy<0&&topItems.length){focus.zone='top';}
    return render();
  }
  if(!lanes.length)return;
  if(dy){
    var nr=focus.r+dy;
    if(nr<0){focus.zone='btns';focus.b=0;return render();}
    if(nr>=lanes.length)return;
    focus.r=nr;var tr=rowsEl.querySelectorAll('.lane')[nr].querySelector('.track');
    focus.c=Math.min(+tr.dataset.c||0,lanes[nr].items.length-1);
  } else {
    var nc=focus.c+dx;
    if(nc<0){focus.zone='rail';return render();}
    if(nc>=lanes[focus.r].items.length)return;
    focus.c=nc;
  }
  render();setHero(cur());
}

function ok(){
  var ov=topOv(),z=focus.zone;
  if(ov){if(ov.f&&ACT[ov.f.dataset.ok])ACT[ov.f.dataset.ok](ov.f);return;}
  if(z==='rail'){var k=navEls[focus.n].dataset.k;if(k!==page)go(k);focus.zone=PAGES[k].view?'view':'rows';return render();}
  if(z==='view'){if(vf&&ACT[vf.dataset.ok])ACT[vf.dataset.ok](vf);return;}
  if(z==='menu'){mv.genre=menuItems[focus.m];if(mv.tab==='anime')mv.tab='all';focus.zone='top';go('movies');return;}
  if(z==='top'){
    var it=topItem(focus.t);
    if(it.t==='tab'){if(mv.tab!==it.k){mv.tab=it.k;if(it.k==='anime')mv.genre='';go('movies');}}
    else if(it.t==='menu')openMenu(topFocusables()[focus.t]);
    else if(it.k==='search'){go('search');}
    else toast(it.k==='hdmi'?'Entrada do PC: HDMI 1':'Biblioteca atualizada');
    return render();
  }
  var x=cur(),T=curType();if(!x)return;
  if(z==='btns'){
    var b=document.querySelectorAll('#btns .btn')[focus.b].dataset.b;
    if(b==='info')return (T==='game'||T==='cap')?toast(x.name+': '+x.hours):openDetail(x);

  }
  openItem(x,T);
}

}

    var cs=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),i=ACCENTS.findIndex(function(a){return a[0]===cs;});
    document.documentElement.style.setProperty('--accent',ACCENTS[(i+1)%ACCENTS.length][0]);
  }
  else return;
  e.preventDefault();
});

var keys=(location.search.match(/keys=([\w,]+)/)||[])[1];
if(keys)keys.split(',').reduce(function(t,k){
  var key={Up:'ArrowUp',Down:'ArrowDown',Left:'ArrowLeft',Right:'ArrowRight',Back:'Escape'}[k]||k;
  setTimeout(function(){dispatchEvent(new KeyboardEvent('keydown',{key:key}));},t);
  return t+(key==='Enter'?3000:500);
},2500);
</script>
</body>
