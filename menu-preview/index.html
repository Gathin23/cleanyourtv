<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu branco: tons de roxo</title>
<style>
@font-face{font-family:'Hanken Grotesk';src:url('hanken.ttf')}
body{margin:0;background:#2a2f6b url('wallpaper.jpg') center/cover;font-family:'Hanken Grotesk',sans-serif;color:#fff}
.wrap{display:flex;gap:56px;justify-content:center;padding:40px 24px}
.col{display:flex;flex-direction:column;align-items:center;gap:16px}
.nav{width:84px;border-radius:42px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;box-shadow:0 16px 40px rgba(0,0,0,0.35)}
.it{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.it svg{stroke:var(--p)}
.it.sel{background:var(--tint)}
.it.on{background:var(--p);box-shadow:0 0 0 5px var(--ring)}
.it.on svg{stroke:#fff}
.name{font-size:20px;font-weight:700;text-align:center}
.meta{font-size:15px;color:rgba(255,255,255,0.85);text-align:center;line-height:1.45;background:rgba(10,14,36,0.6);padding:8px 12px;border-radius:12px}
.legend{text-align:center;font-size:15px;padding-bottom:28px;color:rgba(255,255,255,0.9)}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="legend">Em cada menu: 1º ícone = página atual (fundo lilás claro) · 3º ícone = item com foco do controle (círculo roxo cheio)</div>
<script>
var icons = [
  '<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/>',
  '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
  '<path d="M7 7h10v5l-2 3H9l-2-3z"/><path d="M9.5 7V3.5M14.5 7V3.5"/><path d="M12 15v6"/>',
  '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
];
var opts = [
  ['A · Vibrante', '#533afd', '6,2:1', 'o roxo atual da Home'],
  ['B · Profundo', '#4329d6', '8,3:1', 'mais escuro, ainda vivo'],
  ['C · Escuro suave', '#3a2a8c', '11,1:1', 'quase índigo, bem sóbrio'],
  ['D · Lavanda', '#7c6cf0', '4,0:1', 'mais claro e suave']
];
var w = document.getElementById('wrap');
opts.forEach(function(o){
  var tint = o[1] + '1f', ring = o[1] + '40';
  var html = '<div class="col" style="--p:' + o[1] + ';--tint:' + tint + ';--ring:' + ring + '"><div class="nav">';
  icons.forEach(function(ic, i){
    html += '<div class="it' + (i === 0 ? ' sel' : '') + (i === 2 ? ' on' : '') + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + ic + '</svg></div>';
  });
  html += '</div><div class="name">' + o[0] + '</div><div class="meta">' + o[1] + '<br>contraste ' + o[2] + '<br>' + o[3] + '</div></div>';
  w.insertAdjacentHTML('beforeend', html);
});
</script>
</body>
</html>
