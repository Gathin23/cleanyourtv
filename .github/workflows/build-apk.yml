name: Build CleanYourTV APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Configure Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

  - name: Install SDK 34
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

  - name: Build CleanYourTV
    run: |
      cd launcher
      chmod +x gradlew
      ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CleanYourTV-APK
      path: launcher/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
