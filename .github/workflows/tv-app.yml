name: Mobile, Tablet & Android TV App CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permissions
        run: |
          chmod +x launcher/gradlew
          chmod +x tv-app/gradlew

      - name: Build Clean Launcher APK
        run: |
          cd launcher
          ./gradlew assembleDebug --no-daemon

      - name: Run TV App Unit Tests
        run: |
          cd tv-app
          ./gradlew test --no-daemon

      - name: Build Mobile, Tablet & TV App APK
        run: |
          cd tv-app
          ./gradlew assembleDebug --no-daemon

      - name: Package Both APKs in Zip Artifact
        run: |
          mkdir -p build-bundle
          cp tv-app/app/build/outputs/apk/debug/app-debug.apk build-bundle/cleanyourtv-mobile-tv-app.apk
          cp launcher/app/build/outputs/apk/debug/app-debug.apk build-bundle/cleanyourtv-clean-launcher.apk
          cd build-bundle
          zip -r cleanyourtv-mobile-tv-launcher-apks.zip cleanyourtv-mobile-tv-app.apk cleanyourtv-clean-launcher.apk

      - name: Upload Both APKs Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-mobile-tv-launcher-apks
          path: build-bundle/cleanyourtv-mobile-tv-launcher-apks.zip
