name: Build CleanYourTV launcher APK

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: launcher
        run: ./gradlew assembleRelease --console=plain

      - name: Prepare APK
        run: |
          cp launcher/app/build/outputs/apk/release/app-release.apk CleanYourTV-Launcher-v3.1.apk
          ls -la CleanYourTV-Launcher-v3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-Launcher-apk
          path: CleanYourTV-Launcher-v3.1.apk

      - name: Create GitHub release
        run: |
          TAG="launcher-v3.1-build-${{ github.run_number }}"
          gh release create "$TAG" CleanYourTV-Launcher-v3.1.apk --title "CleanYourTV launcher v3.1 (build ${{ github.run_number }})" --notes "Clean Your TV launcher APK built from Gathin23/cleanyourtv (MIT License). Debug-signed release build."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
