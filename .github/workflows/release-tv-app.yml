name: Mobile, Tablet & Android TV App Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permissions
        run: |
          chmod +x launcher/gradlew
          chmod +x tv-app/gradlew

      - name: Build Launcher Release APK
        run: |
          cd launcher
          ./gradlew assembleRelease --no-daemon

      - name: Build TV App Release APK
        run: |
          cd tv-app
          ./gradlew assembleRelease --no-daemon

      - name: Create Release Zip Bundle
        run: |
          mkdir -p release-bundle
          cp tv-app/app/build/outputs/apk/release/*.apk release-bundle/cleanyourtv-mobile-tv-app.apk || true
          cp launcher/app/build/outputs/apk/release/*.apk release-bundle/cleanyourtv-clean-launcher.apk || true
          cd release-bundle
          zip -r cleanyourtv-bundle.zip cleanyourtv-mobile-tv-app.apk cleanyourtv-clean-launcher.apk
          sha256sum cleanyourtv-bundle.zip > cleanyourtv-bundle.zip.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-bundle/cleanyourtv-bundle.zip
            release-bundle/cleanyourtv-bundle.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
