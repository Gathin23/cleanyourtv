plugins {
    id 'com.android.application'
}

android {
    namespace 'com.norma.tvlauncher'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.norma.tvlauncher')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "norma-tv-launcher.apk"
        }
        if (variant.buildType.name == 'release') {
            variant.assembleProvider.configure {
                doLast {
                    copy {
                        from "${layout.buildDirectory.get()}/outputs/apk/release/norma-tv-launcher.apk"
                        into "${layout.buildDirectory.get()}/outputs/apk/release"
                        rename { "app-release.apk" }
                    }
                    copy {
                        from "${layout.buildDirectory.get()}/outputs/apk/release/norma-tv-launcher.apk"
                        into "${rootDir}/.."
                        rename { "norma-tv-launcher.apk" }
                    }
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
