plugins { id 'com.android.application' }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.sanskarixd.elppa'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', '../app/src/main/java']
            res.srcDirs = ['src/main/res', '../app/src/main/res']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../app/proguard-rules.pro'
            // Local Phase 1 sideloads: preserve this machine's key for updates.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { disable 'MissingTranslation' } // Phase 1 strings are English; upstream translations are retained.
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
