plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.pbanddev.tatami.app'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.pbanddev.tatami'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB like cleanyourtv's launcher: signed with the local debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':plan')
}
