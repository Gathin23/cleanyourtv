plugins {
    id 'com.android.application'
}

// Your Unsplash access key, if you have one: in secrets.properties beside this add-on's settings.gradle
// (git-ignored) as `unsplash.access_key=...`, or in UNSPLASH_ACCESS_KEY. It is compiled into your own APK only;
// without it the Unsplash source is simply not offered.
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.isFile()) secretsFile.withInputStream { secrets.load(it) }
def unsplashKey = (System.getenv('UNSPLASH_ACCESS_KEY') ?: secrets.getProperty('unsplash.access_key', '')).trim()
if (!(unsplashKey ==~ /[A-Za-z0-9_-]*/)) throw new GradleException('unsplash.access_key has unexpected characters')

android {
    namespace 'com.gathin.artframe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.artframe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'UNSPLASH_KEY', "\"${unsplashKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    // The starter paintings are already JPEGs: storing them uncompressed lets the app read them straight.
    androidResources {
        noCompress 'jpg'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
