plugins {
    id 'com.android.application'
}

android {
    namespace 'no.cleanyourtv.nrkradioshortcut'
    compileSdk 30

    defaultConfig {
        applicationId 'no.cleanyourtv.nrkradioshortcut'
        minSdk 23
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
