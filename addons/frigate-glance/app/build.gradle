plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.nickld.frigateglance'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.nickld.frigateglance'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    // Test only (never in the APK): plain JVM tests, src/test. org.json because android.jar's copy is a stub there.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
