plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.shivamsingh262.photoprints'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.shivamsingh262.photoprints'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published: sign with the debug key, as the launcher does.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the date on each print.
    testImplementation 'junit:junit:4.13.2'
}
