plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.luyzfernando08.sleeptimer'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.luyzfernando08.sleeptimer'
        minSdk 28   // GLOBAL_ACTION_LOCK_SCREEN, which puts the TV to sleep, is Android 9
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
